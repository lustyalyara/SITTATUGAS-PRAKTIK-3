<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA | Sistem Informasi Bahan Ajar</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">UT</div><div><strong>SITTA</strong><small>Universitas Terbuka</small></div></div>
      <div class="side-label">MENU UTAMA</div>
      <button class="nav-link" :class="{active: tab === 'stok'}" @click="tab='stok'"><span>▦</span> Stok Bahan Ajar</button>
      <button class="nav-link" :class="{active: tab === 'tracking'}" @click="tab='tracking'"><span>⌁</span> Tracking DO</button>
      <div class="sidebar-bottom"><div class="avatar">A</div><div><strong>Administrator</strong><small>Petugas UT-Daerah</small></div></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><span class="eyebrow">SISTEM INFORMASI TIRAS DAN TRANSAKSI BAHAN AJAR</span><h1>{{ tab === 'stok' ? 'Stok Bahan Ajar' : 'Tracking Delivery Order' }}</h1></div><div class="top-user"><span class="online-dot"></span> Sistem Aktif</div></header>
      <section v-if="tab === 'stok'"><ba-stock-table :stok="stok" :upbjj-list="upbjjList" :kategori-list="kategoriList" @update-stok="stok=$event"></ba-stock-table></section>
      <section v-else><do-tracking :tracking="tracking" :paket-list="paketList" :pengiriman-list="pengirimanList" :stok="stok" @update-tracking="tracking=$event"></do-tracking></section>
      <footer>© 2026 SITTA · Universitas Terbuka <span>Praktik 3 – Vue.js</span></footer>
    </main>
  </div>
  <script src="js/services/api.js"></script>
  <script src="js/app.js"></script>
</body></html>

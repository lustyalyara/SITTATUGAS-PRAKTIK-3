<script type="text/x-template" id="tpl-do-tracking">
<div>
  <div class="stats-grid tracking-stats"><div class="stat-card"><div class="stat-icon blue">⌁</div><div><small>Total Delivery Order</small><strong>{{ allOrders.length }}</strong><span>Data pengiriman</span></div></div><div class="stat-card"><div class="stat-icon green">✓</div><div><small>Dalam Perjalanan</small><strong>{{ allOrders.filter(x => x.status === 'Dalam Perjalanan').length }}</strong><span>Pengiriman berjalan</span></div></div><div class="stat-card"><div class="stat-icon orange">＋</div><div><small>Paket Tersedia</small><strong>{{ paketList.length }}</strong><span>Pilihan paket bahan ajar</span></div></div></div>
  <div class="panel"><div class="panel-heading"><div><h2>Pelacakan Pengiriman</h2><p>Temukan informasi perjalanan Delivery Order berdasarkan nomor DO atau NIM.</p></div></div>
    <form class="tracking-search" @submit.prevent="searchOrder"><div class="field"><label>Nomor DO / NIM</label><input ref="searchInput" v-model.trim="keyword" @keydown.esc.prevent="clearSearch" placeholder="Contoh: DO2025-0001 atau 123456789"></div><button class="btn btn-primary" type="submit">Cari Pengiriman</button><button class="btn btn-light" type="button" @click="clearSearch">Reset</button></form>
    <div v-if="searched && results.length === 0" class="notice warning">Data pengiriman tidak ditemukan. Periksa kembali nomor DO atau NIM.</div>
    <div v-if="results.length" class="result-list"><div v-for="order in results" :key="order.nomorDO" class="order-card"><div class="order-top"><div><span class="eyebrow">DELIVERY ORDER</span><h3>{{ order.nomorDO }}</h3></div><span class="status-pill status-info">{{ order.status }}</span></div><div class="order-details"><div><small>Nama penerima</small><b>{{ order.nama }}</b></div><div><small>NIM</small><b>{{ order.nim }}</b></div><div><small>Ekspedisi</small><b>{{ order.ekspedisi }}</b></div><div><small>Tanggal kirim</small><b>{{ order.tanggalKirim | tanggal }}</b></div><div><small>Paket</small><b>{{ order.paket }}</b></div><div><small>Total harga</small><b>{{ order.total | rupiah }}</b></div></div><div class="journey"><h4>Riwayat Perjalanan</h4><div v-for="(step, i) in order.perjalanan" :key="i" class="journey-item"><span class="journey-dot"></span><div><b>{{ step.keterangan }}</b><small>{{ step.waktu | tanggalWaktu }}</small></div></div><p v-if="!order.perjalanan.length" class="muted">Belum ada riwayat perjalanan.</p></div>
      <form class="progress-form" @submit.prevent="addProgress(order)"><div class="field"><label>Tambah keterangan perjalanan</label><input v-model.trim="progressText[order.nomorDO]" placeholder="Contoh: Paket tiba di kantor cabang" required></div><button class="btn btn-primary" type="submit">＋ Tambah Progress</button></form>
    </div></div>
  </div>
  <div class="panel"><div class="panel-heading"><div><h2>Tambah Delivery Order</h2><p>Buat data pengiriman bahan ajar baru.</p></div><span class="new-do-number">{{ nextDoNumber }}</span></div>
    <form @submit.prevent="createOrder"><div class="form-grid"><div class="field"><label>Nomor DO (otomatis)</label><input :value="nextDoNumber" disabled></div><div class="field"><label>NIM</label><input v-model.trim="form.nim" maxlength="20" placeholder="Masukkan NIM" required></div><div class="field"><label>Nama penerima</label><input v-model.trim="form.nama" placeholder="Nama lengkap" required></div><div class="field"><label>Ekspedisi</label><select v-model="form.ekspedisi" required><option value="" disabled>Pilih ekspedisi</option><option v-for="x in pengirimanList" :key="x.kode" :value="x.nama">{{ x.nama }}</option></select></div><div class="field"><label>Paket bahan ajar</label><select v-model="form.paket" required><option value="" disabled>Pilih paket</option><option v-for="x in paketList" :key="x.kode" :value="x.kode">{{ x.kode }} – {{ x.nama }}</option></select></div><div class="field"><label>Tanggal kirim</label><input v-model="form.tanggalKirim" type="date" required></div></div>
      <div v-if="selectedPackage" class="package-detail"><div><small>PAKET DIPILIH</small><b>{{ selectedPackage.nama }}</b></div><div><small>Isi paket</small><b>{{ selectedPackage.isi.join(', ') }}</b></div><div><small>Total harga</small><b>{{ selectedPackage.harga | rupiah }}</b></div></div>
      <p v-if="formError" class="form-error">{{ formError }}</p><div class="form-footer"><span class="muted">Pastikan data penerima dan paket sudah benar.</span><button class="btn btn-primary" type="submit">Simpan Delivery Order</button></div>
    </form>
  </div>
</div>
</script>
